<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
<div class="card">
  <img src="images/image-equilibrium.jpg" alt="Equilibrium image">
  <h2 class="item-name">Equilibrium #3429</h2>
  <p class="descript">Our Equilibrium collection promotes balance and calm.</p>
  <img class="icon-ethereum" src="images/icon-ethereum.svg" alt="icon-ethereum">
  <p class="eth-text">0.041 ETH</p>
  <hr class="solid">
  <img class="image-avatar" src="images/image-avatar.png">
  <p class="creation"><span class="creation-header">Creation of</span> Jules Wyvern</p>


</div>
</body>
</html>
